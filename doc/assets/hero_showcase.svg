<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#182234" />
      <stop offset="60%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#04060A" />
    </radialGradient>

    <!-- Titanium Phone Chassis Gradient -->
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4659" />
      <stop offset="50%" stop-color="#1E2633" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>

    <!-- Camera Lens Reflection -->
    <radialGradient id="lensReflect" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="60%" stop-color="#0A0D14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <filter id="islandShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="1280" height="720" fill="url(#bgGlow)" />

  <!-- Top Hero Header -->
  <g transform="translate(80, 50)">
    <text x="0" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">android_island_bar</text>
    <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif" font-size="15" font-weight="400">
      Universal Cross-Platform Dynamic Island for Android &amp; iOS with DisplayCutout Auto-Snapping
    </text>
  </g>

  <!-- Platform Badges Top Right -->
  <g transform="translate(900, 50)">
    <rect x="0" y="8" width="130" height="32" rx="16" fill="#111827" stroke="#374151" stroke-width="1" />
    <circle cx="18" cy="24" r="5" fill="#00E676" />
    <text x="70" y="29" fill="#F3F4F6" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Android + iOS</text>

    <rect x="140" y="8" width="150" height="32" rx="16" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="215" y="29" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">100% Play Store Safe</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PHONE 1 (LEFT): Real Android Device with Center Punch-Hole & Dual Split   -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 120)" filter="url(#phoneShadow)">
    <!-- Device Outer Chassis -->
    <rect width="320" height="540" rx="44" fill="#131822" stroke="url(#phoneBorder)" stroke-width="4" />
    <!-- Bezel Inner -->
    <rect x="8" y="8" width="304" height="524" rx="38" fill="#090D14" stroke="#000000" stroke-width="2" />
    <!-- Screen Glass Overlay -->
    <rect x="8" y="8" width="304" height="524" rx="38" fill="url(#screenGlass)" />

    <!-- Speaker Grill -->
    <rect x="135" y="14" width="50" height="3.5" rx="1.75" fill="#242D3D" />

    <!-- Android Status Bar Info -->
    <text x="32" y="32" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">09:41</text>
    <path d="M 276 25 L 286 25 L 286 31 L 276 31 Z" fill="#E2E8F0" />
    <path d="M 264 25 C 267 22, 271 22, 274 25" stroke="#E2E8F0" stroke-width="1.5" fill="none" />

    <!-- PHYSICAL PUNCH HOLE LENS -->
    <circle cx="160" cy="30" r="6.5" fill="url(#lensReflect)" stroke="#1F2937" stroke-width="1.2" />
    <circle cx="158.5" cy="28.5" r="1.8" fill="#4B5563" />

    <!-- DUAL SPLIT ISLAND MORPHING (Active State) -->
    <!-- Primary Pill: Spotify Media Player Hugging Cutout -->
    <g filter="url(#islandShadow)">
      <rect x="28" y="16" width="186" height="36" rx="18" fill="#000000" stroke="#1F2937" stroke-width="0.8" />
      
      <!-- Album Thumb -->
      <rect x="35" y="22" width="24" height="24" rx="6" fill="#1E293B" />
      <circle cx="47" cy="34" r="5" fill="#00E676" />
      
      <!-- Song Title & Artist -->
      <text x="66" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="700">Starboy</text>
      <text x="66" y="42" fill="#94A3B8" font-family="sans-serif" font-size="8.5">The Weeknd</text>

      <!-- Equalizer Waveform Bouncing -->
      <rect x="172" y="32" width="2.5" height="10" rx="1.2" fill="#00E676" />
      <rect x="177" y="26" width="2.5" height="16" rx="1.2" fill="#00E676" />
      <rect x="182" y="30" width="2.5" height="12" rx="1.2" fill="#00E676" />
      <rect x="187" y="35" width="2.5" height="7" rx="1.2" fill="#00E676" />
    </g>

    <!-- Secondary Detached Bubble: Active 4m Countdown Timer -->
    <g filter="url(#islandShadow)">
      <circle cx="258" cy="34" r="18" fill="#000000" stroke="#1F2937" stroke-width="0.8" />
      <circle cx="258" cy="34" r="13" fill="none" stroke="#FF9100" stroke-width="2.2" stroke-dasharray="60,25" />
      <text x="258" y="37.5" fill="#FF9100" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">4m</text>
    </g>

    <!-- Realistic App Content in Background (Mock Dashboard) -->
    <g transform="translate(24, 80)">
      <text x="8" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">Good morning</text>
      <text x="8" y="42" fill="#64748B" font-family="sans-serif" font-size="12">San Francisco, CA</text>

      <rect x="8" y="60" width="256" height="120" rx="16" fill="#141B26" stroke="#1E293B" stroke-width="1" />
      <text x="24" y="90" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700">HARDWARE CUTOUT AUTO-SNAP</text>
      <text x="24" y="112" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Samsung &amp; Motorola Ready</text>
      <text x="24" y="132" fill="#94A3B8" font-family="sans-serif" font-size="11">Detects physical punch-hole bounds &amp; safe insets via WindowInsets.</text>
      <text x="24" y="158" fill="#00E676" font-family="sans-serif" font-size="11" font-weight="700">✓ Multi-Task Concurrent Split</text>
    </g>

    <text x="160" y="500" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Android Cutout Snapping • Split Mode</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PHONE 2 (CENTER): Expanded Interactive Media Player with Scrub Controls   -->
  <!-- ========================================================================= -->
  <g transform="translate(480, 100)" filter="url(#phoneShadow)">
    <!-- Device Outer Chassis (Slightly elevated focus) -->
    <rect width="320" height="560" rx="44" fill="#131822" stroke="url(#phoneBorder)" stroke-width="4" />
    <rect x="8" y="8" width="304" height="544" rx="38" fill="#090D14" stroke="#000000" stroke-width="2" />
    <rect x="8" y="8" width="304" height="544" rx="38" fill="url(#screenGlass)" />

    <!-- Speaker -->
    <rect x="135" y="14" width="50" height="3.5" rx="1.75" fill="#242D3D" />

    <!-- EXPANDED INTERACTIVE ISLAND SHEET -->
    <g filter="url(#islandShadow)">
      <rect x="18" y="24" width="284" height="196" rx="28" fill="#000000" stroke="#263040" stroke-width="1" />
      
      <!-- Top Track Info -->
      <g transform="translate(34, 42)">
        <rect x="0" y="0" width="52" height="52" rx="12" fill="#1E293B" />
        <circle cx="26" cy="26" r="14" fill="#00E676" fill-opacity="0.2" />
        <text x="26" y="32" fill="#00E676" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">♫</text>

        <text x="64" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="14.5" font-weight="700">Starboy (feat. Daft Punk)</text>
        <text x="64" y="38" fill="#94A3B8" font-family="sans-serif" font-size="12">The Weeknd • Starboy</text>

        <!-- Right Equalizer -->
        <rect x="226" y="20" width="3" height="12" rx="1.5" fill="#00E676" />
        <rect x="232" y="14" width="3" height="18" rx="1.5" fill="#00E676" />
        <rect x="238" y="18" width="3" height="14" rx="1.5" fill="#00E676" />
        <rect x="244" y="23" width="3" height="9" rx="1.5" fill="#00E676" />
      </g>

      <!-- Scrub Bar -->
      <g transform="translate(34, 114)">
        <rect x="0" y="0" width="252" height="4.5" rx="2.25" fill="#1E293B" />
        <rect x="0" y="0" width="92" height="4.5" rx="2.25" fill="#00E676" />
        <circle cx="92" cy="2.25" r="5" fill="#00E676" />

        <text x="0" y="18" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="500">1:24</text>
        <text x="252" y="18" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="500" text-anchor="end">3:50</text>
      </g>

      <!-- Controls Row -->
      <g transform="translate(142, 172)">
        <!-- Prev -->
        <circle cx="-42" cy="0" r="14" fill="#141B26" />
        <text x="-42" y="4" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">⏮</text>
        
        <!-- Pause -->
        <circle cx="0" cy="0" r="19" fill="#00E676" />
        <text x="0" y="5" fill="#000000" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">❚❚</text>
        
        <!-- Next -->
        <circle cx="42" cy="0" r="14" fill="#141B26" />
        <text x="42" y="4" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">⏭</text>
      </g>
    </g>

    <!-- Underlying App Details -->
    <g transform="translate(32, 250)">
      <rect x="0" y="0" width="256" height="110" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="18" y="32" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="700">Rubber-Band Gesture Drag</text>
      <text x="18" y="52" fill="#94A3B8" font-family="sans-serif" font-size="11">• Drag down to expand with spring physics</text>
      <text x="18" y="70" fill="#94A3B8" font-family="sans-serif" font-size="11">• Swipe up to stash or collapse</text>
      <text x="18" y="88" fill="#94A3B8" font-family="sans-serif" font-size="11">• Haptic tactile impact on snap</text>
    </g>

    <text x="160" y="525" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Expanded Interactive Player</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PHONE 3 (RIGHT): iOS & Turn-by-Turn Rideshare Navigation Tracking         -->
  <!-- ========================================================================= -->
  <g transform="translate(860, 120)" filter="url(#phoneShadow)">
    <!-- Device Outer Chassis (iPhone Pro Style) -->
    <rect width="320" height="540" rx="44" fill="#131822" stroke="url(#phoneBorder)" stroke-width="4" />
    <rect x="8" y="8" width="304" height="524" rx="38" fill="#090D14" stroke="#000000" stroke-width="2" />
    <rect x="8" y="8" width="304" height="524" rx="38" fill="url(#screenGlass)" />

    <!-- Speaker -->
    <rect x="135" y="14" width="50" height="3.5" rx="1.75" fill="#242D3D" />

    <!-- iOS Native Dynamic Island Hugging -->
    <g filter="url(#islandShadow)">
      <rect x="52" y="18" width="216" height="36" rx="18" fill="#000000" stroke="#1F2937" stroke-width="0.8" />
      
      <!-- Nav Arrow Icon -->
      <circle cx="72" cy="36" r="10" fill="#00B0FF" fill-opacity="0.2" />
      <path d="M 68 40 L 72 31 L 76 40 L 72 38 Z" fill="#00B0FF" />

      <!-- Destination / ETA -->
      <text x="90" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">In 500 ft, Turn Right</text>
      <text x="90" y="44" fill="#94A3B8" font-family="sans-serif" font-size="9">Market St • 12 min</text>

      <!-- ETA Badge -->
      <rect x="220" y="27" width="38" height="18" rx="9" fill="#00B0FF" fill-opacity="0.25" />
      <text x="239" y="40" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">12m</text>
    </g>

    <!-- App Body: Turn-by-Turn Map View -->
    <g transform="translate(24, 76)">
      <!-- Map Graphic Representation -->
      <rect x="8" y="8" width="256" height="150" rx="16" fill="#141E2E" stroke="#1E293B" stroke-width="1" />
      <path d="M 28 140 Q 80 80 130 90 T 230 30" stroke="#00B0FF" stroke-width="4" fill="none" stroke-linecap="round" />
      <circle cx="230" cy="30" r="6" fill="#00E676" />
      <circle cx="28" cy="140" r="5" fill="#38BDF8" />

      <!-- Info Pill -->
      <rect x="8" y="174" width="256" height="74" rx="14" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="24" y="202" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">iOS Dynamic Island Alignment</text>
      <text x="24" y="222" fill="#94A3B8" font-family="sans-serif" font-size="11">Detects iPhone safeAreaInsets (>=54pt) &amp; adapts seamlessly in-app.</text>
    </g>

    <text x="160" y="500" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">iOS Island Binding • Navigation</text>
  </g>
</svg>
