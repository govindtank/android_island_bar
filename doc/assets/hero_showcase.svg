<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <!-- Background Canvas Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141B28" />
      <stop offset="50%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#04060A" />
    </radialGradient>

    <!-- Panel Card Gradients -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131A26" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <!-- Accent Highlights -->
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Stage Canvas -->
  <rect width="1200" height="620" fill="url(#bgGrad)" rx="24" />
  <rect width="1196" height="616" x="2" y="2" fill="none" stroke="#1E293B" stroke-width="1.5" rx="23" stroke-dasharray="6,4" />

  <!-- Centered Top Header -->
  <g transform="translate(600, 48)" text-anchor="middle">
    <text y="0" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">UNIVERSAL FLUTTER PACKAGE</text>
    <text y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">android_island_bar</text>
    <text y="52" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif" font-size="14" font-weight="400">
      Hardware Cutout Auto-Snapping • Dual Split Multi-Tasking • Android, iOS &amp; Web
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 1 (LEFT): Android Hardware Cutout Snapping & Dual Split Bubble      -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 120)" filter="url(#cardShadow)">
    <!-- Outer Container -->
    <rect width="350" height="460" rx="24" fill="url(#panelGrad)" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Header Badge -->
    <g transform="translate(24, 24)">
      <rect width="130" height="24" rx="12" fill="#00E676" fill-opacity="0.12" stroke="#00E676" stroke-width="1" />
      <text x="65" y="16" fill="#00E676" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ANDROID CUTOUT</text>
    </g>

    <!-- Top Status Bar Row -->
    <g transform="translate(24, 66)">
      <text x="6" y="14" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">09:41</text>
      <!-- Center Camera Punch Hole Lens -->
      <circle cx="151" cy="11" r="5.5" fill="#020617" stroke="#334155" stroke-width="1.2" />
      <circle cx="150" cy="10" r="1.5" fill="#64748B" />
      <!-- Battery / 5G -->
      <path d="M 284 6 L 294 6 L 294 14 L 284 14 Z" fill="#94A3B8" />
    </g>

    <!-- Dynamic Island: Dual Split Mode Mockup -->
    <!-- Primary Pill (Music Hugging Cutout) -->
    <g transform="translate(24, 94)" filter="url(#pillShadow)">
      <rect width="210" height="40" rx="20" fill="#000000" stroke="#334155" stroke-width="1" />
      
      <!-- Leading Icon -->
      <circle cx="22" cy="20" r="10" fill="#00E676" fill-opacity="0.2" />
      <text x="22" y="24" fill="#00E676" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">♫</text>

      <!-- Label -->
      <text x="40" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Starboy</text>
      <text x="40" y="30" fill="#94A3B8" font-family="sans-serif" font-size="9">The Weeknd</text>

      <!-- Equalizer Waveform Bars -->
      <g transform="translate(170, 13)">
        <rect x="0" y="4" width="2.5" height="10" rx="1.2" fill="#00E676" />
        <rect x="5" y="0" width="2.5" height="14" rx="1.2" fill="#00E676" />
        <rect x="10" y="3" width="2.5" height="11" rx="1.2" fill="#00E676" />
        <rect x="15" y="6" width="2.5" height="8" rx="1.2" fill="#00E676" />
      </g>
    </g>

    <!-- Secondary Detached Bubble (Timer) -->
    <g transform="translate(246, 94)" filter="url(#pillShadow)">
      <circle cx="20" cy="20" r="20" fill="#000000" stroke="#FF9100" stroke-width="1" />
      <circle cx="20" cy="20" r="14" fill="none" stroke="#FF9100" stroke-width="2" stroke-dasharray="65,25" />
      <text x="20" y="24" fill="#FF9100" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">4m</text>
    </g>

    <!-- Content Card (Inside Safe Bounds) -->
    <g transform="translate(24, 160)">
      <rect width="302" height="260" rx="18" fill="#070B12" stroke="#1E293B" stroke-width="1" />
      
      <g transform="translate(20, 24)">
        <text y="14" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1">DISPLAYCUTOUT BINDING</text>
        <text y="38" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Hardware Punch-Hole Hugging</text>
        
        <text y="68" fill="#94A3B8" font-family="sans-serif" font-size="12">• Automatically queries Android WindowInsets</text>
        <text y="90" fill="#94A3B8" font-family="sans-serif" font-size="12">• Centers directly over camera lens</text>
        <text y="112" fill="#94A3B8" font-family="sans-serif" font-size="12">• Supports Center, Left Punch &amp; Notches</text>
        <text y="134" fill="#94A3B8" font-family="sans-serif" font-size="12">• Concurrent tasks split into dual bubbles</text>
        
        <!-- Feature Tag -->
        <g transform="translate(0, 160)">
          <rect width="180" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="90" y="18" fill="#00E676" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ Zero Dangerous Permissions</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2 (CENTER): Expanded Interactive Card & Gesture Physics             -->
  <!-- ========================================================================= -->
  <g transform="translate(425, 100)" filter="url(#cardShadow)">
    <!-- Outer Container (Hero Elevated) -->
    <rect width="350" height="480" rx="24" fill="url(#panelGrad)" stroke="#00E676" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Header Badge -->
    <g transform="translate(24, 24)">
      <rect width="140" height="24" rx="12" fill="#00E676" fill-opacity="0.15" stroke="#00E676" stroke-width="1" />
      <text x="70" y="16" fill="#00E676" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">EXPANDED CONTROLS</text>
    </g>

    <!-- Expanded Media Card (Generous 24px inner margins) -->
    <g transform="translate(24, 64)" filter="url(#pillShadow)">
      <rect width="302" height="204" rx="24" fill="#000000" stroke="#334155" stroke-width="1.2" />
      
      <!-- Top Track Info -->
      <g transform="translate(20, 22)">
        <!-- Album Art -->
        <rect width="44" height="44" rx="10" fill="#1E293B" />
        <circle cx="22" cy="22" r="11" fill="#00E676" fill-opacity="0.25" />
        <text x="22" y="26" fill="#00E676" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">♫</text>

        <!-- Track & Artist -->
        <text x="56" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Starboy (feat. Daft Punk)</text>
        <text x="56" y="34" fill="#94A3B8" font-family="sans-serif" font-size="11.5">The Weeknd • Starboy</text>

        <!-- Live Equalizer on Right -->
        <g transform="translate(235, 12)">
          <rect x="0" y="4" width="2.5" height="12" rx="1.2" fill="#00E676" />
          <rect x="5" y="0" width="2.5" height="16" rx="1.2" fill="#00E676" />
          <rect x="10" y="3" width="2.5" height="13" rx="1.2" fill="#00E676" />
          <rect x="15" y="7" width="2.5" height="9" rx="1.2" fill="#00E676" />
        </g>
      </g>

      <!-- Scrub Bar -->
      <g transform="translate(20, 88)">
        <rect width="262" height="4" rx="2" fill="#1E293B" />
        <rect width="98" height="4" rx="2" fill="#00E676" />
        <circle cx="98" cy="2" r="5" fill="#00E676" />

        <text x="0" y="18" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="500">1:24</text>
        <text x="262" y="18" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="500" text-anchor="end">3:50</text>
      </g>

      <!-- Playback Controls -->
      <g transform="translate(151, 150)">
        <circle cx="-46" cy="0" r="14" fill="#1E293B" />
        <text x="-46" y="4" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">⏮</text>
        
        <circle cx="0" cy="0" r="20" fill="#00E676" />
        <text x="0" y="5" fill="#000000" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">❚❚</text>
        
        <circle cx="46" cy="0" r="14" fill="#1E293B" />
        <text x="46" y="4" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">⏭</text>
      </g>
    </g>

    <!-- Bottom Feature Description -->
    <g transform="translate(24, 290)">
      <rect width="302" height="160" rx="18" fill="#070B12" stroke="#1E293B" stroke-width="1" />
      <g transform="translate(20, 22)">
        <text y="14" fill="#00E676" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1">GESTURE PHYSICS</text>
        <text y="38" fill="#FFFFFF" font-family="sans-serif" font-size="14.5" font-weight="700">Rubber-Band Drag &amp; Haptics</text>
        
        <text y="68" fill="#94A3B8" font-family="sans-serif" font-size="12">• Drag down with spring dampening</text>
        <text y="90" fill="#94A3B8" font-family="sans-serif" font-size="12">• Swipe up to collapse or stash</text>
        <text y="112" fill="#94A3B8" font-family="sans-serif" font-size="12">• Opaque hit-testing prevents tap leaks</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 3 (RIGHT): iOS Dynamic Island Binding & Rideshare Navigation        -->
  <!-- ========================================================================= -->
  <g transform="translate(810, 120)" filter="url(#cardShadow)">
    <!-- Outer Container -->
    <rect width="350" height="460" rx="24" fill="url(#panelGrad)" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Header Badge -->
    <g transform="translate(24, 24)">
      <rect width="130" height="24" rx="12" fill="#00B0FF" fill-opacity="0.12" stroke="#00B0FF" stroke-width="1" />
      <text x="65" y="16" fill="#00B0FF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">IOS INTEGRATION</text>
    </g>

    <!-- Top Status Bar Row -->
    <g transform="translate(24, 66)">
      <text x="6" y="14" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">09:41</text>
      <path d="M 284 6 L 294 6 L 294 14 L 284 14 Z" fill="#94A3B8" />
    </g>

    <!-- iOS Native Dynamic Island Hugging -->
    <g transform="translate(24, 94)" filter="url(#pillShadow)">
      <rect width="302" height="40" rx="20" fill="#000000" stroke="#334155" stroke-width="1" />
      
      <!-- Nav Arrow -->
      <circle cx="22" cy="20" r="10" fill="#00B0FF" fill-opacity="0.2" />
      <path d="M 18 24 L 22 15 L 26 24 L 22 22 Z" fill="#00B0FF" />

      <!-- Instruction Text -->
      <text x="40" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">In 500 ft, Turn Right</text>
      <text x="40" y="30" fill="#94A3B8" font-family="sans-serif" font-size="9">Market St • 12 min</text>

      <!-- ETA Badge -->
      <rect x="250" y="11" width="38" height="18" rx="9" fill="#00B0FF" fill-opacity="0.25" />
      <text x="269" y="24" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">12m</text>
    </g>

    <!-- Content Card -->
    <g transform="translate(24, 160)">
      <rect width="302" height="260" rx="18" fill="#070B12" stroke="#1E293B" stroke-width="1" />
      
      <g transform="translate(20, 24)">
        <text y="14" fill="#00B0FF" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1">APPLE DYNAMIC ISLAND</text>
        <text y="38" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Unified In-App Geometry</text>
        
        <text y="68" fill="#94A3B8" font-family="sans-serif" font-size="12">• Detects iPhone safeAreaInsets (>=54pt)</text>
        <text y="90" fill="#94A3B8" font-family="sans-serif" font-size="12">• Native feel for iPhone 14 Pro, 15 &amp; 16</text>
        <text y="112" fill="#94A3B8" font-family="sans-serif" font-size="12">• Graceful notch fallback on older models</text>
        <text y="134" fill="#94A3B8" font-family="sans-serif" font-size="12">• Zero iOS/Android platform switches needed</text>
        
        <!-- Code snippet tag -->
        <g transform="translate(0, 160)">
          <rect width="210" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="105" y="18" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">IslandBar.showNavigation(...)</text>
        </g>
      </g>
    </g>
  </g>
</svg>
