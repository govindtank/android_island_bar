<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <!-- Background Canvas Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141B28" />
      <stop offset="50%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#04060A" />
    </radialGradient>

    <!-- Deep OLED Island Shadow -->
    <filter id="islandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Deep Stage Canvas -->
  <rect width="1200" height="640" fill="url(#bgGrad)" rx="24" />
  <rect width="1196" height="636" x="2" y="2" fill="none" stroke="#1E293B" stroke-width="1.5" rx="23" stroke-dasharray="6,4" />

  <!-- Centered Top Header -->
  <g transform="translate(600, 48)" text-anchor="middle">
    <text y="0" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">UNIVERSAL FLUTTER PACKAGE</text>
    <text y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">android_island_bar</text>
    <text y="52" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif" font-size="14" font-weight="400">
      Live Dynamic Island Presets &amp; States (from example showcase)
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 1 (LEFT): COMPACT PRESETS                                          -->
  <!-- ========================================================================= -->

  <!-- 1. Media Player (Compact) -->
  <g transform="translate(60, 130)">
    <text x="0" y="-8" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">01 • LIVE MEDIA PLAYER</text>
    <g filter="url(#islandGlow)">
      <rect width="260" height="40" rx="20" fill="#000000" stroke="#1E293B" stroke-width="1.2" />
      <!-- Album Thumb -->
      <rect x="8" y="8" width="24" height="24" rx="7" fill="#1E293B" />
      <text x="20" y="24" fill="#00E676" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">♫</text>
      <!-- Title -->
      <text x="40" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="11.5" font-weight="700">Starboy • The Weeknd</text>
      <!-- Equalizer Bars -->
      <g transform="translate(216, 13)">
        <rect x="0" y="4" width="2.5" height="10" rx="1.2" fill="#00E676" />
        <rect x="5" y="0" width="2.5" height="14" rx="1.2" fill="#00E676" />
        <rect x="10" y="3" width="2.5" height="11" rx="1.2" fill="#00E676" />
        <rect x="15" y="6" width="2.5" height="8" rx="1.2" fill="#00E676" />
      </g>
    </g>
  </g>

  <!-- 2. Countdown Timer (Compact) -->
  <g transform="translate(60, 240)">
    <text x="0" y="-8" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">02 • COUNTDOWN TIMER</text>
    <g filter="url(#islandGlow)">
      <rect width="250" height="40" rx="20" fill="#000000" stroke="#1E293B" stroke-width="1.2" />
      <!-- Circular Ring Indicator -->
      <circle cx="20" cy="20" r="11" fill="none" stroke="#332414" stroke-width="2.5" />
      <circle cx="20" cy="20" r="11" fill="none" stroke="#FF9100" stroke-width="2.5" stroke-dasharray="45,25" />
      <circle cx="20" cy="20" r="2" fill="#FF9100" />
      <!-- Title -->
      <text x="40" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Pasta Timer</text>
      <!-- Tabular Time -->
      <text x="196" y="25" fill="#FF9100" font-family="'Fira Code', monospace, sans-serif" font-size="12" font-weight="700">04:00</text>
    </g>
  </g>

  <!-- 3. Multi-Task Split Mode -->
  <g transform="translate(60, 350)">
    <text x="0" y="-8" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">03 • MULTI-TASK SPLIT MODE</text>
    <!-- Primary Pill -->
    <g filter="url(#islandGlow)">
      <rect width="190" height="40" rx="20" fill="#000000" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="18" cy="20" r="9" fill="#00E676" fill-opacity="0.2" />
      <text x="18" y="24" fill="#00E676" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">♫</text>
      <text x="34" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Starboy</text>
      <g transform="translate(148, 13)">
        <rect x="0" y="4" width="2.5" height="10" rx="1.2" fill="#00E676" />
        <rect x="5" y="0" width="2.5" height="14" rx="1.2" fill="#00E676" />
        <rect x="10" y="3" width="2.5" height="11" rx="1.2" fill="#00E676" />
        <rect x="15" y="6" width="2.5" height="8" rx="1.2" fill="#00E676" />
      </g>
    </g>
    <!-- Secondary Detached Bubble -->
    <g transform="translate(202, 0)" filter="url(#islandGlow)">
      <circle cx="20" cy="20" r="20" fill="#000000" stroke="#FF9100" stroke-width="1.2" />
      <circle cx="20" cy="20" r="14" fill="none" stroke="#FF9100" stroke-width="2.2" stroke-dasharray="60,25" />
      <text x="20" y="24" fill="#FF9100" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">38s</text>
    </g>
  </g>

  <!-- 4. Active VoIP Call -->
  <g transform="translate(60, 460)">
    <text x="0" y="-8" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">04 • ACTIVE VOIP / PHONE CALL</text>
    <g filter="url(#islandGlow)">
      <rect width="250" height="40" rx="20" fill="#000000" stroke="#1E293B" stroke-width="1.2" />
      <!-- Phone Icon -->
      <circle cx="20" cy="20" r="11" fill="#00E676" fill-opacity="0.2" />
      <text x="20" y="24" fill="#00E676" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">✆</text>
      <!-- Caller Name -->
      <text x="40" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Alex Mercer</text>
      <!-- Duration -->
      <text x="196" y="25" fill="#00E676" font-family="'Fira Code', monospace, sans-serif" font-size="12" font-weight="700">04:12</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTER: EXPANDED INTERACTIVE SHEET                                        -->
  <!-- ========================================================================= -->
  <g transform="translate(425, 160)" filter="url(#islandGlow)">
    <text x="0" y="-12" fill="#00E676" font-family="sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">EXPANDED INTERACTIVE SHEET</text>
    <rect width="350" height="220" rx="28" fill="#000000" stroke="#263040" stroke-width="1.5" />
    
    <!-- Top Track Info -->
    <g transform="translate(24, 24)">
      <!-- Album Art -->
      <rect width="48" height="48" rx="12" fill="#1E293B" />
      <circle cx="24" cy="24" r="12" fill="#00E676" fill-opacity="0.25" />
      <text x="24" y="29" fill="#00E676" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">♫</text>

      <!-- Track Name & Artist -->
      <text x="60" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="14.5" font-weight="700">Starboy (feat. Daft Punk)</text>
      <text x="60" y="38" fill="#94A3B8" font-family="sans-serif" font-size="12">The Weeknd • Starboy</text>

      <!-- Equalizer Visualizer on Right -->
      <g transform="translate(270, 14)">
        <rect x="0" y="4" width="3" height="12" rx="1.5" fill="#00E676" />
        <rect x="6" y="0" width="3" height="16" rx="1.5" fill="#00E676" />
        <rect x="12" y="3" width="3" height="13" rx="1.5" fill="#00E676" />
        <rect x="18" y="7" width="3" height="9" rx="1.5" fill="#00E676" />
      </g>
    </g>

    <!-- Scrub Bar -->
    <g transform="translate(24, 98)">
      <rect width="302" height="4.5" rx="2.25" fill="#1E293B" />
      <rect width="108" height="4.5" rx="2.25" fill="#00E676" />
      <circle cx="108" cy="2.25" r="5" fill="#00E676" />

      <text x="0" y="18" fill="#64748B" font-family="sans-serif" font-size="10.5" font-weight="500">1:24</text>
      <text x="302" y="18" fill="#64748B" font-family="sans-serif" font-size="10.5" font-weight="500" text-anchor="end">3:50</text>
    </g>

    <!-- Playback Controls -->
    <g transform="translate(175, 164)">
      <!-- Prev -->
      <circle cx="-52" cy="0" r="16" fill="#141B26" />
      <text x="-52" y="4" fill="#E2E8F0" font-family="sans-serif" font-size="13" text-anchor="middle">⏮</text>
      
      <!-- Pause (Large Green Circle) -->
      <circle cx="0" cy="0" r="22" fill="#00E676" />
      <text x="0" y="6" fill="#000000" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">❚❚</text>
      
      <!-- Next -->
      <circle cx="52" cy="0" r="16" fill="#141B26" />
      <text x="52" y="4" fill="#E2E8F0" font-family="sans-serif" font-size="13" text-anchor="middle">⏭</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 3 (RIGHT): MORE LIVE PRESETS                                       -->
  <!-- ========================================================================= -->

  <!-- 5. Turn-by-Turn Navigation -->
  <g transform="translate(870, 130)">
    <text x="0" y="-8" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">05 • TURN-BY-TURN NAVIGATION</text>
    <g filter="url(#islandGlow)">
      <rect width="270" height="40" rx="20" fill="#000000" stroke="#1E293B" stroke-width="1.2" />
      <!-- Arrow Icon -->
      <circle cx="20" cy="20" r="11" fill="#00B0FF" fill-opacity="0.2" />
      <path d="M 16 24 L 20 15 L 24 24 L 20 22 Z" fill="#00B0FF" />
      <!-- Direction Text -->
      <text x="40" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">In 500 ft, Turn Right</text>
      <!-- ETA Chip -->
      <rect x="216" y="11" width="42" height="18" rx="9" fill="#00B0FF" fill-opacity="0.25" />
      <text x="237" y="24" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">18 min</text>
    </g>
  </g>

  <!-- 6. Download / Upload Progress -->
  <g transform="translate(870, 240)">
    <text x="0" y="-8" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">06 • DOWNLOAD / UPLOAD PROGRESS</text>
    <g filter="url(#islandGlow)">
      <rect width="270" height="40" rx="20" fill="#000000" stroke="#1E293B" stroke-width="1.2" />
      <!-- Cloud Icon -->
      <circle cx="20" cy="20" r="11" fill="#00B0FF" fill-opacity="0.2" />
      <text x="20" y="24" fill="#00B0FF" font-family="sans-serif" font-size="12" text-anchor="middle">☁</text>
      <!-- Task Title -->
      <text x="40" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Firmware_OTA.zip</text>
      <!-- Pct Badge -->
      <rect x="220" y="11" width="38" height="18" rx="9" fill="#00B0FF" fill-opacity="0.25" />
      <text x="239" y="24" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">42%</text>
    </g>
  </g>

  <!-- 7. OTP & High-Priority Alert -->
  <g transform="translate(870, 350)">
    <text x="0" y="-8" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">07 • OTP &amp; ACTION ALERT</text>
    <g filter="url(#islandGlow)">
      <rect width="270" height="40" rx="20" fill="#000000" stroke="#1E293B" stroke-width="1.2" />
      <!-- Key Icon -->
      <circle cx="20" cy="20" r="11" fill="#00E676" fill-opacity="0.2" />
      <text x="20" y="24" fill="#00E676" font-family="sans-serif" font-size="12" text-anchor="middle">🔑</text>
      <!-- Alert Title -->
      <text x="40" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Verification Code</text>
      <!-- Action Chip -->
      <rect x="170" y="10" width="88" height="20" rx="10" fill="#00E676" fill-opacity="0.2" />
      <text x="214" y="24" fill="#00E676" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Copy 849201</text>
    </g>
  </g>

  <!-- 8. One-Line Controller Trigger -->
  <g transform="translate(870, 460)">
    <text x="0" y="-8" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">08 • 1-LINE PROGRAMMATIC TRIGGER</text>
    <g filter="url(#islandGlow)">
      <rect width="270" height="40" rx="20" fill="#000000" stroke="#334155" stroke-width="1.2" />
      <text x="135" y="25" fill="#38BDF8" font-family="'Fira Code', monospace, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">IslandBar.showMedia(...)</text>
    </g>
  </g>

  <!-- Bottom Global Badges -->
  <g transform="translate(600, 595)" text-anchor="middle">
    <text fill="#64748B" font-family="sans-serif" font-size="12" font-weight="600">
      Zero Dangerous Permissions • 100% Google Play &amp; App Store Safe • Pure Flutter Overlay
    </text>
  </g>
</svg>
