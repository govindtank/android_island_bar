<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141C2B" />
      <stop offset="60%" stop-color="#090D15" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <!-- Phone Chassis Gradient -->
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B485C" />
      <stop offset="50%" stop-color="#1F2837" />
      <stop offset="100%" stop-color="#0D121A" />
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Camera Lens Reflection -->
    <radialGradient id="lensReflect" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <filter id="islandShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- STRICT CLIP PATHS FOR SCREEN AND WIDGETS TO GUARANTEE NO BORDER BLEEDING -->
    <clipPath id="screenClip1">
      <rect x="8" y="8" width="304" height="524" rx="38" />
    </clipPath>

    <clipPath id="screenClip2">
      <rect x="8" y="8" width="304" height="544" rx="38" />
    </clipPath>

    <clipPath id="screenClip3">
      <rect x="8" y="8" width="304" height="524" rx="38" />
    </clipPath>

    <clipPath id="phone1PillClip">
      <rect x="24" y="18" width="192" height="38" rx="19" />
    </clipPath>

    <clipPath id="phone2CardClip">
      <rect x="20" y="24" width="280" height="204" rx="28" />
    </clipPath>

    <clipPath id="phone3PillClip">
      <rect x="36" y="18" width="248" height="38" rx="19" />
    </clipPath>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="1280" height="720" fill="url(#bgGlow)" />

  <!-- Top Hero Header -->
  <g transform="translate(80, 48)">
    <text x="0" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">android_island_bar</text>
    <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif" font-size="15" font-weight="400">
      Universal Cross-Platform Dynamic Island for Android &amp; iOS with DisplayCutout Auto-Snapping
    </text>
  </g>

  <!-- Platform Badges Top Right -->
  <g transform="translate(890, 48)">
    <rect x="0" y="8" width="130" height="32" rx="16" fill="#111827" stroke="#374151" stroke-width="1" />
    <circle cx="18" cy="24" r="5" fill="#00E676" />
    <text x="70" y="29" fill="#F3F4F6" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Android + iOS</text>

    <rect x="140" y="8" width="160" height="32" rx="16" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="220" y="29" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">100% Play Store Safe</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PHONE 1 (LEFT): Real Android Device with Center Punch-Hole & Dual Split   -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 120)" filter="url(#phoneShadow)">
    <!-- Device Outer Chassis -->
    <rect width="320" height="540" rx="44" fill="#111622" stroke="url(#phoneBorder)" stroke-width="4" />
    
    <!-- All Screen Content Strictly Contained in Screen ClipPath -->
    <g clip-path="url(#screenClip1)">
      <!-- Bezel Inner Screen -->
      <rect x="8" y="8" width="304" height="524" fill="#070A0F" stroke="#000000" stroke-width="2" />
      <rect x="8" y="8" width="304" height="524" fill="url(#screenGlass)" />

      <!-- Android Status Bar Info -->
      <text x="28" y="32" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">09:41</text>
      <path d="M 280 25 L 290 25 L 290 31 L 280 31 Z" fill="#E2E8F0" />
      <path d="M 268 25 C 271 22, 275 22, 278 25" stroke="#E2E8F0" stroke-width="1.5" fill="none" />

      <!-- PHYSICAL PUNCH HOLE LENS -->
      <circle cx="160" cy="30" r="6" fill="url(#lensReflect)" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="158.5" cy="28.5" r="1.6" fill="#64748B" />

      <!-- DUAL SPLIT ISLAND MORPHING (Active State) -->
      <!-- Primary Pill: Spotify Media Player Hugging Cutout -->
      <g filter="url(#islandShadow)">
        <rect x="24" y="18" width="192" height="38" rx="19" fill="#000000" stroke="#1E293B" stroke-width="1" />
        <g clip-path="url(#phone1PillClip)">
          <!-- Album Thumb -->
          <rect x="30" y="24" width="26" height="26" rx="8" fill="#1E293B" />
          <circle cx="43" cy="37" r="6" fill="#00E676" />
          
          <!-- Song Title & Artist -->
          <text x="64" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Starboy</text>
          <text x="64" y="45" fill="#94A3B8" font-family="sans-serif" font-size="9">The Weeknd</text>

          <!-- Equalizer Waveform Bouncing -->
          <rect x="168" y="33" width="2.5" height="10" rx="1.2" fill="#00E676" />
          <rect x="173" y="27" width="2.5" height="16" rx="1.2" fill="#00E676" />
          <rect x="178" y="30" width="2.5" height="13" rx="1.2" fill="#00E676" />
          <rect x="183" y="35" width="2.5" height="8" rx="1.2" fill="#00E676" />
        </g>
      </g>

      <!-- Secondary Detached Bubble: Active 4m Countdown Timer -->
      <g filter="url(#islandShadow)">
        <circle cx="258" cy="37" r="19" fill="#000000" stroke="#1E293B" stroke-width="1" />
        <circle cx="258" cy="37" r="13" fill="none" stroke="#FF9100" stroke-width="2.2" stroke-dasharray="60,25" />
        <text x="258" y="40.5" fill="#FF9100" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">4m</text>
      </g>

      <!-- Realistic App Content in Background (Mock Dashboard) -->
      <g transform="translate(24, 82)">
        <text x="8" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">Good morning</text>
        <text x="8" y="42" fill="#64748B" font-family="sans-serif" font-size="12">San Francisco, CA</text>

        <rect x="4" y="60" width="264" height="120" rx="16" fill="#111724" stroke="#1E293B" stroke-width="1" />
        <text x="20" y="88" fill="#38BDF8" font-family="sans-serif" font-size="11.5" font-weight="700">HARDWARE CUTOUT AUTO-SNAP</text>
        <text x="20" y="108" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Samsung &amp; Motorola Ready</text>
        <text x="20" y="128" fill="#94A3B8" font-family="sans-serif" font-size="10.5">Detects physical punch-hole bounds &amp; safe insets via WindowInsets.</text>
        <text x="20" y="154" fill="#00E676" font-family="sans-serif" font-size="11" font-weight="700">✓ Multi-Task Concurrent Split</text>
      </g>

      <text x="160" y="500" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Android Cutout Snapping • Split Mode</text>
    </g>

    <!-- Speaker Grill -->
    <rect x="135" y="14" width="50" height="3.5" rx="1.75" fill="#242D3D" />
  </g>

  <!-- ========================================================================= -->
  <!-- PHONE 2 (CENTER): Expanded Interactive Media Player with Scrub Controls   -->
  <!-- ========================================================================= -->
  <g transform="translate(480, 100)" filter="url(#phoneShadow)">
    <!-- Device Outer Chassis (Slightly elevated focus) -->
    <rect width="320" height="560" rx="44" fill="#111622" stroke="url(#phoneBorder)" stroke-width="4" />

    <!-- Screen Content with Screen ClipPath -->
    <g clip-path="url(#screenClip2)">
      <rect x="8" y="8" width="304" height="544" fill="#070A0F" stroke="#000000" stroke-width="2" />
      <rect x="8" y="8" width="304" height="544" fill="url(#screenGlass)" />

      <!-- EXPANDED INTERACTIVE ISLAND SHEET -->
      <g filter="url(#islandShadow)">
        <rect x="20" y="24" width="280" height="204" rx="28" fill="#000000" stroke="#263040" stroke-width="1" />
        
        <!-- Inside Expanded Card with Card ClipPath -->
        <g clip-path="url(#phone2CardClip)">
          <!-- Top Track Info -->
          <g transform="translate(36, 42)">
            <rect x="0" y="0" width="48" height="48" rx="12" fill="#1E293B" />
            <circle cx="24" cy="24" r="12" fill="#00E676" fill-opacity="0.2" />
            <text x="24" y="30" fill="#00E676" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">♫</text>

            <text x="60" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="13.5" font-weight="700">Starboy (feat. Daft Punk)</text>
            <text x="60" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11.5">The Weeknd • Starboy</text>

            <!-- Right Equalizer -->
            <rect x="220" y="18" width="2.5" height="12" rx="1.2" fill="#00E676" />
            <rect x="226" y="12" width="2.5" height="18" rx="1.2" fill="#00E676" />
            <rect x="232" y="16" width="2.5" height="14" rx="1.2" fill="#00E676" />
            <rect x="238" y="21" width="2.5" height="9" rx="1.2" fill="#00E676" />
          </g>

          <!-- Scrub Bar (Comfortably centered inside card) -->
          <g transform="translate(36, 110)">
            <rect x="0" y="0" width="248" height="4.5" rx="2.25" fill="#1E293B" />
            <rect x="0" y="0" width="90" height="4.5" rx="2.25" fill="#00E676" />
            <circle cx="90" cy="2.25" r="5" fill="#00E676" />

            <text x="0" y="18" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="500">1:24</text>
            <text x="248" y="18" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="500" text-anchor="end">3:50</text>
          </g>

          <!-- Controls Row -->
          <g transform="translate(160, 172)">
            <!-- Prev -->
            <circle cx="-45" cy="0" r="14" fill="#141B26" />
            <text x="-45" y="4" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">⏮</text>
            
            <!-- Pause -->
            <circle cx="0" cy="0" r="19" fill="#00E676" />
            <text x="0" y="5" fill="#000000" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">❚❚</text>
            
            <!-- Next -->
            <circle cx="45" cy="0" r="14" fill="#141B26" />
            <text x="45" y="4" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">⏭</text>
          </g>
        </g>
      </g>

      <!-- Underlying App Details -->
      <g transform="translate(28, 252)">
        <rect x="0" y="0" width="264" height="110" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1" />
        <text x="18" y="30" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="700">Rubber-Band Gesture Drag</text>
        <text x="18" y="52" fill="#94A3B8" font-family="sans-serif" font-size="11">• Drag down to expand with spring physics</text>
        <text x="18" y="70" fill="#94A3B8" font-family="sans-serif" font-size="11">• Swipe up to stash or collapse</text>
        <text x="18" y="88" fill="#94A3B8" font-family="sans-serif" font-size="11">• Haptic tactile impact on snap</text>
      </g>

      <text x="160" y="525" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Expanded Interactive Player</text>
    </g>

    <!-- Speaker -->
    <rect x="135" y="14" width="50" height="3.5" rx="1.75" fill="#242D3D" />
  </g>

  <!-- ========================================================================= -->
  <!-- PHONE 3 (RIGHT): iOS & Turn-by-Turn Rideshare Navigation Tracking         -->
  <!-- ========================================================================= -->
  <g transform="translate(860, 120)" filter="url(#phoneShadow)">
    <!-- Device Outer Chassis (iPhone Pro Style) -->
    <rect width="320" height="540" rx="44" fill="#111622" stroke="url(#phoneBorder)" stroke-width="4" />

    <!-- Screen Content with Screen ClipPath -->
    <g clip-path="url(#screenClip3)">
      <rect x="8" y="8" width="304" height="524" fill="#070A0F" stroke="#000000" stroke-width="2" />
      <rect x="8" y="8" width="304" height="524" fill="url(#screenGlass)" />

      <!-- iOS Native Dynamic Island Hugging -->
      <g filter="url(#islandShadow)">
        <rect x="36" y="18" width="248" height="38" rx="19" fill="#000000" stroke="#1E293B" stroke-width="1" />
        
        <g clip-path="url(#phone3PillClip)">
          <!-- Nav Arrow Icon -->
          <circle cx="56" cy="37" r="10" fill="#00B0FF" fill-opacity="0.2" />
          <path d="M 52 41 L 56 32 L 60 41 L 56 39 Z" fill="#00B0FF" />

          <!-- Destination / ETA -->
          <text x="74" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="700">In 500 ft, Turn Right</text>
          <text x="74" y="45" fill="#94A3B8" font-family="sans-serif" font-size="9">Market St • 12 min</text>

          <!-- ETA Badge (Inside pill with 16px right margin) -->
          <rect x="232" y="27" width="38" height="19" rx="9.5" fill="#00B0FF" fill-opacity="0.25" />
          <text x="251" y="40.5" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">12m</text>
        </g>
      </g>

      <!-- App Body: Turn-by-Turn Map View -->
      <g transform="translate(24, 76)">
        <rect x="4" y="8" width="264" height="150" rx="16" fill="#111B2B" stroke="#1E293B" stroke-width="1" />
        <path d="M 28 140 Q 80 80 130 90 T 230 30" stroke="#00B0FF" stroke-width="4" fill="none" stroke-linecap="round" />
        <circle cx="230" cy="30" r="6" fill="#00E676" />
        <circle cx="28" cy="140" r="5" fill="#38BDF8" />

        <!-- Info Pill -->
        <rect x="4" y="174" width="264" height="74" rx="14" fill="#111827" stroke="#1F2937" stroke-width="1" />
        <text x="18" y="202" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">iOS Dynamic Island Alignment</text>
        <text x="18" y="222" fill="#94A3B8" font-family="sans-serif" font-size="10.5">Detects iPhone safeAreaInsets (>=54pt) &amp; adapts seamlessly in-app.</text>
      </g>

      <text x="160" y="500" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">iOS Island Binding • Navigation</text>
    </g>

    <!-- Speaker -->
    <rect x="135" y="14" width="50" height="3.5" rx="1.75" fill="#242D3D" />
  </g>
</svg>
