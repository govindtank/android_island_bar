<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#1DE9B6" />
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D500F9" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="640" fill="url(#bgGrad)" rx="24" />
  <rect width="1196" height="636" x="2" y="2" fill="none" stroke="#334155" stroke-width="1.5" rx="23" stroke-dasharray="6,4" />

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#00E676" fill-opacity="0.12" stroke="#00E676" stroke-width="1.2" />
    <text x="80" y="18" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">FLUTTER PACKAGE</text>
    
    <text x="0" y="68" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">android_island_bar</text>
    <text x="0" y="96" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      The True Hardware-Cutout Morphing Dynamic Island for Android &amp; Flutter
    </text>
  </g>

  <!-- Top Right Live Badges -->
  <g transform="translate(870, 52)">
    <rect x="0" y="0" width="125" height="32" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <circle cx="18" cy="16" r="6" fill="#00E676" />
    <text x="70" y="21" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pub 160/160</text>

    <rect x="135" y="0" width="135" height="32" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="202" y="21" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">0 Permissions</text>
  </g>

  <!-- COLUMN 1: CUTOUT AUTO-SNAPPING -->
  <g transform="translate(60, 180)">
    <rect width="340" height="400" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Title -->
    <text x="24" y="36" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">01 • HARDWARE CUTOUT</text>
    <text x="24" y="62" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">DisplayCutout Snapping</text>
    <text x="24" y="86" fill="#94A3B8" font-family="sans-serif" font-size="12">Direct native binding to Android WindowInsets</text>

    <!-- Center Punch Phone Demo Mock -->
    <g transform="translate(24, 110)">
      <rect width="292" height="74" rx="14" fill="#05070B" stroke="#1E293B" stroke-width="1.5" />
      <!-- Top Center Cutout Hugging Island -->
      <rect x="66" y="8" width="160" height="34" rx="17" fill="#000000" stroke="#334155" stroke-width="1" />
      <circle cx="146" cy="25" r="5" fill="#111827" stroke="#374151" stroke-width="1" /> <!-- Camera Lens -->
      <circle cx="86" cy="25" r="7" fill="#00E676" />
      <text x="110" y="29" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600">Center Punch</text>
      <text x="146" y="62" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle">Samsung Galaxy S/M • Motorola Edge</text>
    </g>

    <!-- Left Punch Phone Demo Mock -->
    <g transform="translate(24, 202)">
      <rect width="292" height="74" rx="14" fill="#05070B" stroke="#1E293B" stroke-width="1.5" />
      <!-- Top Left Cutout Hugging Island -->
      <rect x="14" y="8" width="150" height="34" rx="17" fill="#000000" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="25" r="5" fill="#111827" stroke="#374151" stroke-width="1" /> <!-- Camera Lens -->
      <text x="50" y="29" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="600">Left Punch Lens</text>
      <circle cx="142" cy="25" r="4" fill="#38BDF8" />
      <text x="146" y="62" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle">OnePlus • Pixel • Xiaomi Corner Cutout</text>
    </g>

    <!-- Teardrop Notch / Floating Mock -->
    <g transform="translate(24, 294)">
      <rect width="292" height="74" rx="14" fill="#05070B" stroke="#1E293B" stroke-width="1.5" />
      <!-- Floating Pill -->
      <rect x="76" y="10" width="140" height="32" rx="16" fill="#000000" stroke="#00E676" stroke-width="1" stroke-opacity="0.4" />
      <text x="146" y="30" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Floating / Notch Bar</text>
      <text x="146" y="62" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle">Graceful Safe-Area &amp; Web/iOS Fallback</text>
    </g>
  </g>

  <!-- COLUMN 2: MULTI-TASK SPLIT MODE -->
  <g transform="translate(430, 180)">
    <rect width="340" height="400" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Title -->
    <text x="24" y="36" fill="#D500F9" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">02 • MULTI-TASKING</text>
    <text x="24" y="62" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">Dual Split Island Mode</text>
    <text x="24" y="86" fill="#94A3B8" font-family="sans-serif" font-size="12">Concurrent active sessions auto-split smoothly</text>

    <!-- Split Visual Demonstration -->
    <g transform="translate(24, 116)">
      <rect width="292" height="110" rx="14" fill="#05070B" stroke="#1E293B" stroke-width="1.5" />
      
      <!-- Primary Pill: Music -->
      <rect x="14" y="24" width="190" height="42" rx="21" fill="#000000" stroke="#00E676" stroke-width="1.2" />
      <circle cx="36" cy="45" r="9" fill="#00E676" fill-opacity="0.2" />
      <text x="36" y="49" fill="#00E676" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">♫</text>
      <text x="54" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Starboy</text>
      <text x="54" y="55" fill="#94A3B8" font-family="sans-serif" font-size="9">The Weeknd</text>
      
      <!-- Live Equalizer Bars -->
      <rect x="160" y="44" width="3" height="10" rx="1.5" fill="#00E676" />
      <rect x="166" y="38" width="3" height="16" rx="1.5" fill="#00E676" />
      <rect x="172" y="41" width="3" height="13" rx="1.5" fill="#00E676" />
      <rect x="178" y="46" width="3" height="8" rx="1.5" fill="#00E676" />

      <!-- Secondary Detached Bubble: Timer -->
      <circle cx="248" cy="45" r="21" fill="#000000" stroke="#FF9100" stroke-width="1.2" />
      <circle cx="248" cy="45" r="16" fill="none" stroke="#FF9100" stroke-width="2" stroke-dasharray="75,25" />
      <text x="248" y="49" fill="#FF9100" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">38s</text>

      <text x="146" y="94" fill="#CBD5E1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">
        Primary Pill + Detached Secondary Bubble
      </text>
    </g>

    <!-- Gestures Callout -->
    <g transform="translate(24, 252)">
      <rect width="292" height="116" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <text x="20" y="28" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="700">Fluid Gestures &amp; Physics</text>
      <text x="20" y="50" fill="#94A3B8" font-family="sans-serif" font-size="11">• <tspan fill="#E2E8F0">Tap:</tspan> Expands tapped task instantly</text>
      <text x="20" y="70" fill="#94A3B8" font-family="sans-serif" font-size="11">• <tspan fill="#E2E8F0">Drag Down:</tspan> Squishy rubber-band stretch</text>
      <text x="20" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11">• <tspan fill="#E2E8F0">Swipe Up:</tspan> Dismisses or stashes pill</text>
      <text x="20" y="106" fill="#94A3B8" font-family="sans-serif" font-size="11">• <tspan fill="#E2E8F0">Haptics:</tspan> Tactile feedback on snap &amp; release</text>
    </g>
  </g>

  <!-- COLUMN 3: EXPANDED PRESETS & 1-LINE API -->
  <g transform="translate(800, 180)">
    <rect width="340" height="400" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Title -->
    <text x="24" y="36" fill="#00E676" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">03 • INTERACTIVE EXPANDED</text>
    <text x="24" y="62" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">Rich Interactive Cards</text>
    <text x="24" y="86" fill="#94A3B8" font-family="sans-serif" font-size="12">Expand into full controls with 1-line triggers</text>

    <!-- Expanded Media Card Mock -->
    <g transform="translate(24, 110)">
      <rect width="292" height="152" rx="16" fill="#000000" stroke="#334155" stroke-width="1.2" />
      
      <!-- Album & Info -->
      <rect x="14" y="16" width="44" height="44" rx="10" fill="#1E293B" />
      <circle cx="36" cy="38" r="12" fill="#00E676" fill-opacity="0.25" />
      <text x="36" y="42" fill="#00E676" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">♫</text>

      <text x="68" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Starboy (feat. Daft Punk)</text>
      <text x="68" y="48" fill="#94A3B8" font-family="sans-serif" font-size="11">The Weeknd • Starboy</text>

      <!-- Scrub Bar -->
      <rect x="14" y="74" width="264" height="4" rx="2" fill="#334155" />
      <rect x="14" y="74" width="96" height="4" rx="2" fill="#00E676" />
      <circle cx="110" cy="76" r="4" fill="#00E676" />

      <text x="14" y="92" fill="#64748B" font-family="sans-serif" font-size="10">1:24</text>
      <text x="278" y="92" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="end">3:50</text>

      <!-- Buttons -->
      <circle cx="110" cy="122" r="14" fill="#1E293B" />
      <text x="110" y="126" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">⏮</text>

      <circle cx="146" cy="122" r="18" fill="#00E676" />
      <text x="146" y="127" fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">❚❚</text>

      <circle cx="182" cy="122" r="14" fill="#1E293B" />
      <text x="182" y="126" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">⏭</text>
    </g>

    <!-- Code Snippet -->
    <g transform="translate(24, 280)">
      <rect width="292" height="88" rx="12" fill="#0B0F17" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="26" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="11">AndroidIslandBar.showMedia(</text>
      <text x="24" y="46" fill="#E2E8F0" font-family="'Fira Code', monospace" font-size="11">title: <tspan fill="#A5F3FC">'Starboy'</tspan>,</text>
      <text x="24" y="64" fill="#E2E8F0" font-family="'Fira Code', monospace" font-size="11">artist: <tspan fill="#A5F3FC">'The Weeknd'</tspan>,</text>
      <text x="14" y="80" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="11">);</text>
    </g>
  </g>
</svg>
