name: android_island_bar
description: >-
  A morphing Dynamic Island status bar for Android and Flutter with hardware punch-hole cutout auto-snapping, multi-task split mode, rubber-band drag, and presets.
version: 0.1.0
homepage: https://github.com/govindtank/android_island_bar
repository: https://github.com/govindtank/android_island_bar
issue_tracker: https://github.com/govindtank/android_island_bar/issues

topics:
  - dynamic-island
  - status-bar
  - android
  - ui
  - notification

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.govindtank.android_island_bar
        pluginClass: AndroidIslandBarPlugin
